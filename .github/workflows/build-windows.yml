name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: planner-windows
          path: |
            release/*.exe
            release/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Planner ${{ steps.ver.outputs.version }}
          body: |
            Windows 앱이에요.
            - `Planner.Setup.*.exe`: 설치 파일 (바탕화면 아이콘 생성)
            - `Planner-*-win.zip`: 압축을 풀고 폴더 안의 `Planner.exe`를 실행 (설치 없이)
            서명이 없는 앱이라 Windows나 브라우저가 경고할 수 있어요. 추가 정보 → 실행을 누르세요.
          files: |
            release/*.exe
            release/*.zip
          make_latest: true
